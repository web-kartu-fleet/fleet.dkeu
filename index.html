<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#006A4E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Sistem PIN Top Up Fleet</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #072618, #0b3c26);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      margin-bottom: 20px;
      padding: 30px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .3);
      text-align: center;
    }

    h2, h3 {
      color: #0b3c26;
      margin: 0 0 8px;
    }

    .sub {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .input-group {
      margin-bottom: 16px;
      text-align: left;
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: #0b3c26;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      background: #f9f9f9;
      font-size: 15px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #0b3c26;
      background: #fff;
    }

    input:read-only {
      cursor: not-allowed;
      color: #555;
      background: #eaefe3;
      border-color: #d2ded1;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #0b3c26;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .65;
      cursor: wait;
    }

    .btn-simpan {
      margin-top: 15px;
      background: #2e7d32;
    }

    .input-utama {
      color: #0b3c26;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 6px;
      text-align: center;
    }

    .result {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      text-align: left;
    }

    .sukses {
      color: #2e7d32;
      background: #e8f5e9;
      border: 1px solid #c8e6c9;
    }

    .gagal {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 10px;
      color: #c62828;
      background: #ffebee;
      border: 1px solid #ffcdd2;
      font-weight: bold;
      text-align: center;
    }

    .pin-title {
      margin-bottom: 5px;
      color: #1b5e20;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
    }

    .pin-box {
      margin: 10px 0;
      padding: 10px;
      border: 2px dashed #2e7d32;
      border-radius: 8px;
      background: #fff;
      color: #000;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 6px;
      text-align: center;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-top: 1px solid rgba(0, 0, 0, .08);
      color: #444;
      font-size: 13px;
    }

    .detail-val {
      color: #222;
      font-weight: bold;
      text-align: right;
    }

    .badge-aktif {
      padding: 3px 8px;
      border-radius: 6px;
      background: #2e7d32;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
    }

    .loading {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(11, 60, 38, .9);
      color: #fff;
      font-weight: bold;
      font-style: italic;
      text-align: center;
    }

    #mainContainer,
    #boxAplikasi,
    #formLanjutan {
      display: none;
    }

    #formLanjutan {
      margin-top: 20px;
      padding-top: 15px;
      border-top: 2px dashed #0b3c26;
    }

    #btnInstallPWA {
      display: none;
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 10;
      width: auto;
      padding: 10px 18px;
      border: 2px solid #fff;
      border-radius: 50px;
      background: #006a4e;
      box-shadow: 0 4px 15px rgba(0, 0, 0, .4);
      font-size: 13px;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .card { padding: 22px 18px; }
    }
  </style>
</head>

<body>
  <button id="btnInstallPWA" type="button">📲 Install Aplikasi Fleet</button>

  <div class="card" id="boxLogin">
    <h2>Login Admin Fleet</h2>
    <div class="sub">Silakan masukkan password sistem</div>

    <div class="input-group">
      <label for="userLogin">Username:</label>
      <input id="userLogin" type="text" value="adminfleet" readonly>
    </div>

    <div class="input-group">
      <label for="passLogin">Password:</label>
      <input id="passLogin" type="password" placeholder="Masukkan Password">
    </div>

    <button id="btnLogin" type="button">Masuk Sistem</button>
  </div>

  <main id="mainContainer">
    <section class="card" id="boxInputPin">
      <h3>Input Data PIN Kartu Fleet</h3>
      <div class="sub" style="text-align:left">Tambah data kartu baru ke Sheet "Data PIN"</div>

      <div class="input-group">
        <label for="newNoLengkap">Nomor Kartu Lengkap:</label>
        <input id="newNoLengkap" type="text" inputmode="numeric"
               placeholder="Contoh: 6032770012345678">
      </div>

      <div class="input-group">
        <label for="new4Angka">4 Angka Belakang Kartu:</label>
        <input id="new4Angka" type="text" maxlength="4" inputmode="numeric"
               placeholder="5678">
      </div>

      <div class="input-group">
        <label for="newPin">PIN Kartu:</label>
        <input id="newPin" type="text" maxlength="6" inputmode="numeric"
               placeholder="Masukkan PIN Kartu">
      </div>

      <div class="input-group">
        <label for="newKet">Keterangan:</label>
        <select id="newKet">
          <option value="Aktif">Aktif</option>
          <option value="Tidak Aktif">Tidak Aktif</option>
        </select>
      </div>

      <div class="input-group">
        <label for="newUnit">Bagian / Unit:</label>
        <input id="newUnit" type="text" placeholder="Contoh: Direktorat Keuangan">
      </div>

      <button class="btn-simpan" id="btnSimpanPin" type="button">
        + Simpan Data PIN
      </button>
    </section>

    <section class="card" id="boxAplikasi">
      <h2>Sistem PIN Top Up</h2>
      <div class="sub">Validasi Kartu Fleet Direktorat Keuangan</div>

      <div class="input-group">
        <label for="inputKartu">Masukkan 4 Angka Belakang Kartu:</label>
        <input id="inputKartu" class="input-utama" type="text" maxlength="4"
               inputmode="numeric" pattern="[0-9]*" placeholder="XXXX"
               autocomplete="off">
      </div>

      <button id="btnCari" type="button">Ambil Data PIN</button>
      <div id="loader" class="loading">Memeriksa database...</div>
      <div id="areaHasil" class="result"></div>

      <div id="formLanjutan">
        <div class="input-group">
          <label for="inputPpd">Nomor PPD:</label>
          <input id="inputPpd" type="text" placeholder="Contoh: 0001/0210003/07/26">
        </div>

        <div class="input-group">
          <label for="inputPengirim">Nama Pengirim (Unit/Bagian):</label>
          <input id="inputPengirim" type="text" placeholder="Otomatis Terisi">
        </div>

        <div class="input-group">
          <label for="inputJumlah">Jumlah Top Up Baru (Rp):</label>
          <input id="inputJumlah" type="number" min="1" placeholder="Contoh: 500000">
        </div>

        <button class="btn-simpan" id="btnSimpanTransaksi" type="button">
          ✓ Simpan Ke Sheet Transaksi
        </button>
      </div>

      <div id="areaGagal" class="gagal"></div>
    </section>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbyN0Q4LnnXNSCpi0ArX3w8fA_ad0Y16RoM2pWxT60N-Pwkrn44J7-yO93ZUouHeufB9Vw/exec";

    const $ = id => document.getElementById(id);
    let dataKartuSistem = {};

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    function setLoading(message = "", visible = true) {
      $("loader").textContent = message;
      $("loader").style.display = visible ? "block" : "none";
    }

    function setButtonState(button, disabled) {
      button.disabled = disabled;
    }

    function resetSearchResult() {
      $("areaHasil").style.display = "none";
      $("formLanjutan").style.display = "none";
      $("areaGagal").style.display = "none";
    }

    async function request(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return response.json();
    }

    function sanitizeDigits(input, maxLength = 999) {
      input.value = input.value.replace(/\D/g, "").slice(0, maxLength);
    }

    async function prosesLogin() {
      const username = $("userLogin").value;
      const password = $("passLogin").value;
      const button = $("btnLogin");

      if (!password) {
        alert("Password wajib diisi!");
        return;
      }

      setButtonState(button, true);

      try {
        const params = new URLSearchParams({
          action: "cekLogin",
          u: username,
          p: password
        });

        const data = await request(`${API_URL}?${params}`);

        if (data.status === "sukses") {
          $("boxLogin").style.display = "none";
          $("mainContainer").style.display = "block";
          $("boxAplikasi").style.display = "block";
          $("inputKartu").focus();
        } else {
          alert(data.pesan || "Login gagal.");
        }
      } catch (error) {
        alert("Gagal koneksi ke server: " + error.message);
      } finally {
        setButtonState(button, false);
      }
    }

    async function simpanDataPinBaru() {
      const button = $("btnSimpanPin");
      const payload = {
        action: "simpanDataPin",
        nomorLengkap: $("newNoLengkap").value.trim(),
        empatAngka: $("new4Angka").value.trim(),
        pin: $("newPin").value.trim(),
        keterangan: $("newKet").value,
        unit: $("newUnit").value.trim()
      };

      if (!payload.nomorLengkap || !payload.empatAngka ||
          !payload.pin || !payload.unit) {
        alert("Nomor kartu, 4 angka belakang, PIN, dan unit wajib diisi!");
        return;
      }

      if (payload.empatAngka.length !== 4) {
        alert("4 angka belakang kartu harus terdiri dari 4 digit.");
        return;
      }

      setButtonState(button, true);
      setLoading("Menyimpan data PIN baru...");

      try {
        const data = await request(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        alert(data.pesan || "Proses selesai.");

        if (data.status === "sukses") {
          ["newNoLengkap", "new4Angka", "newPin", "newUnit"]
            .forEach(id => $(id).value = "");
        }
      } catch (error) {
        alert("Gagal menyimpan: " + error.message);
      } finally {
        setLoading("", false);
        setButtonState(button, false);
      }
    }

    async function prosesCari() {
      const input = $("inputKartu").value.trim();
      const button = $("btnCari");

      if (input.length !== 4) {
        alert("Harap masukkan 4 digit angka belakang kartu!");
        return;
      }

      resetSearchResult();
      setButtonState(button, true);
      setLoading("Memeriksa database...");

      try {
        const params = new URLSearchParams({
          action: "cariDataTopUp",
          empatAngka: input
        });

        const data = await request(`${API_URL}?${params}`);

        if (data.status !== "sukses") {
          $("areaGagal").textContent = data.pesan || "Data tidak ditemukan.";
          $("areaGagal").style.display = "block";
          return;
        }

        dataKartuSistem = data;
        $("areaHasil").className = "result sukses";
        $("areaHasil").innerHTML = `
          <div class="pin-title">Gunakan PIN ini di Mesin: (By Jeffry@2026)</div>
          <div class="pin-box">${escapeHtml(data.pin)}</div>
          <div class="detail-row">
            <span>No Kartu Lengkap:</span>
            <span class="detail-val">${escapeHtml(data.kartuLengkap)}</span>
          </div>
          <div class="detail-row">
            <span>4 Digit Terakhir:</span>
            <span class="detail-val">${escapeHtml(data.empatAngka)}</span>
          </div>
          <div class="detail-row">
            <span>Status Kartu:</span>
            <span class="badge-aktif">${escapeHtml(data.statusKartu)}</span>
          </div>
        `;

        $("areaHasil").style.display = "block";
        $("inputPengirim").value = data.unit || "";
        $("formLanjutan").style.display = "block";
      } catch (error) {
        $("areaGagal").textContent = "Error server: " + error.message;
        $("areaGagal").style.display = "block";
      } finally {
        setLoading("", false);
        setButtonState(button, false);
      }
    }

    async function simpanKeTransaksi() {
      const button = $("btnSimpanTransaksi");
      const payload = {
        action: "simpanTransaksi",
        noPpd: $("inputPpd").value.trim(),
        empatAngka: dataKartuSistem.empatAngka,
        pin: dataKartuSistem.pin,
        pengirim: $("inputPengirim").value.trim(),
        jumlah: $("inputJumlah").value
      };

      if (!payload.noPpd || !payload.pengirim || !payload.jumlah) {
        alert("Harap isi No PPD, Pengirim, dan Jumlah Top Up!");
        return;
      }

      setButtonState(button, true);
      setLoading("Menyimpan data transaksi baru...");

      try {
        const data = await request(API_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        alert(data.pesan || "Proses selesai.");

        if (data.status === "sukses") {
          ["inputKartu", "inputPpd", "inputPengirim", "inputJumlah"]
            .forEach(id => $(id).value = "");
          resetSearchResult();
          dataKartuSistem = {};
        }
      } catch (error) {
        alert("Gagal simpan transaksi: " + error.message);
      } finally {
        setLoading("", false);
        setButtonState(button, false);
      }
    }

    $("btnLogin").addEventListener("click", prosesLogin);
    $("btnSimpanPin").addEventListener("click", simpanDataPinBaru);
    $("btnCari").addEventListener("click", prosesCari);
    $("btnSimpanTransaksi").addEventListener("click", simpanKeTransaksi);

    $("passLogin").addEventListener("keydown", event => {
      if (event.key === "Enter") prosesLogin();
    });

    $("inputKartu").addEventListener("input", event => {
      sanitizeDigits(event.target, 4);
      resetSearchResult();
    });

    $("newNoLengkap").addEventListener("input", event => {
      sanitizeDigits(event.target);
      if (event.target.value.length >= 4) {
        $("new4Angka").value = event.target.value.slice(-4);
      }
    });

    $("new4Angka").addEventListener("input", event => sanitizeDigits(event.target, 4));
    $("newPin").addEventListener("input", event => sanitizeDigits(event.target, 6));

    $("inputKartu").addEventListener("keydown", event => {
      if (event.key === "Enter") prosesCari();
    });

    let deferredPrompt;
    const installButton = $("btnInstallPWA");

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      deferredPrompt = event;
      installButton.style.display = "block";
    });

    installButton.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installButton.style.display = "none";
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("sw.js?v=2")
          .catch(error => console.error("Service worker error:", error));
      });
    }
  </script>
</body>
</html>
