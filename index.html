<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem PIN Top Up Fleet</title>

  <!-- PWA Metadata -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#006A4E">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="shortcut icon" href="icon-192.png">

  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif; 
      background: linear-gradient(135deg, #072618 0%, #0B3C26 100%); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      padding: 20px; 
    }

   #btnInstallPWA {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      left: auto; /* Memastikan tidak melebar penuh */
      width: auto; /* Mengikuti lebar konten tombol saja */
      z-index: 9999;
      background-color: #006A4E;
      color: #ffffff;
      border: 2px solid #ffffff;
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    .card { 
      background: #ffffff; 
      padding: 30px; 
      border-radius: 20px; 
      box-shadow: 0 12px 35px rgba(0,0,0,0.3); 
      width: 100%; 
      max-width: 440px; 
      text-align: center; 
      margin-bottom: 20px;
    }

    h2, h3 { color: #0B3C26; margin-top: 0; margin-bottom: 8px; font-weight: 700; }
    .sub { color: #666; font-size: 14px; margin-bottom: 20px; }
    
    .input-group { text-align: left; margin-bottom: 16px; }
    .input-group label { 
      font-size: 13px; 
      font-weight: 600; 
      color: #0B3C26; 
      display: block; 
      margin-bottom: 6px; 
      text-transform: uppercase; 
    }

    input, select { 
      width: 100%; 
      padding: 12px 14px; 
      border: 2px solid #e0e0e0; 
      border-radius: 10px; 
      font-size: 15px; 
      background-color: #f9f9f9; 
    }
    input:focus, select:focus { 
      border-color: #0B3C26; 
      outline: none; 
      background-color: #fff; 
    }
    input:read-only { 
      background-color: #eaefe3; 
      color: #555; 
      border-color: #d2ded1; 
      cursor: not-allowed; 
    }

    .input-utama { font-size: 28px; text-align: center; letter-spacing: 6px; font-weight: bold; color: #0B3C26; }

    button { 
      width: 100%; 
      padding: 14px; 
      background-color: #0B3C26; 
      color: white; 
      border: none; 
      border-radius: 10px; 
      font-size: 16px; 
      cursor: pointer; 
      font-weight: bold; 
      margin-top: 10px; 
    }
    
    .btn-simpan { background-color: #2e7d32; margin-top: 15px; }

    .result { margin-top: 20px; padding: 15px; border-radius: 12px; text-align: left; display: none; }
    .sukses { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    .gagal { background-color: #ffebee; color: #c62828; border: 1px solid #ffcdd2; text-align: center; font-weight: bold; margin-top: 15px; padding: 15px; border-radius: 10px; }
    
    .pin-title { text-align: center; font-weight: bold; margin-bottom: 5px; color: #1b5e20; font-size: 13px; }
    .pin-box { font-size: 36px; font-weight: bold; letter-spacing: 6px; text-align: center; margin: 10px 0; color: #000; background: #fff; padding: 10px; border-radius: 8px; border: 2px dashed #2e7d32; }
    .detail-row { display: flex; justify-content: space-between; border-top: 1px solid rgba(0,0,0,0.08); padding: 8px 0; font-size: 13px; color: #444; }
    .detail-val { font-weight: bold; color: #222; }
    .badge-aktif { background-color: #2e7d32; color: white; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: bold; }

    .loading { display: none; color: #fff; margin-top: 15px; font-style: italic; font-weight: bold; background: rgba(11, 60, 38, 0.9); padding: 10px; border-radius: 8px; }
    #formLanjutan { display: none; margin-top: 20px; border-top: 2px dashed #0B3C26; padding-top: 15px; }
    
    #mainContainer, #boxAplikasi { display: none; }
  </style>
</head>
<body>

  <button id="btnInstallPWA">📲 Install Aplikasi Fleet</button>

  <!-- LOGIN FORM -->
  <div class="card" id="boxLogin">
    <h2>Login Admin Fleet</h2>
    <div class="sub">Silakan masukkan password sistem</div>
    <div class="input-group">
      <label for="userLogin">Username:</label>
      <input type="text" id="userLogin" value="adminfleet" readonly>
    </div>
    <div class="input-group">
      <label for="passLogin">Password:</label>
      <input type="password" id="passLogin" placeholder="Masukkan Password" onkeydown="if(event.key === 'Enter') prosesLogin()">
    </div>
    <button type="button" onclick="prosesLogin()">Masuk Sistem</button>
  </div>

  <!-- CONTAINER SETELAH LOGIN SUKSES -->
  <div id="mainContainer" style="width: 100%; max-width: 440px;">
    
    <!-- BOX INPUT PIN BARU -->
    <div class="card" id="boxInputPin">
      <h3>Input Data PIN Kartu Fleet</h3>
      <div class="sub" style="text-align: left;">Tambah data kartu baru ke Sheet "Data PIN"</div>
      
      <div class="input-group">
        <label for="newNoLengkap">Nomor Kartu Lengkap:</label>
        <input type="text" id="newNoLengkap" placeholder="Contoh: 6032770012345678" oninput="autoFill4Angka(this)">
      </div>
      
      <div class="input-group">
        <label for="new4Angka">4 Angka Belakang Kartu:</label>
        <input type="text" id="new4Angka" maxlength="4" placeholder="5678">
      </div>

      <div class="input-group">
        <label for="newPin">PIN Kartu:</label>
        <input type="text" id="newPin" maxlength="6" placeholder="Masukkan PIN Kartu">
      </div>

      <div class="input-group">
        <label for="newKet">Keterangan:</label>
        <select id="newKet">
          <option value="Aktif">Aktif</option>
          <option value="Tidak Aktif">Tidak Aktif</option>
        </select>
      </div>

      <div class="input-group">
        <label for="newUnit">Bagian / Unit:</label>
        <input type="text" id="newUnit" placeholder="Contoh: Direktorat Keuangan">
      </div>

      <button type="button" class="btn-simpan" onclick="simpanDataPinBaru()">+ Simpan Data PIN</button>
    </div>

    <!-- BOX SISTEM TOP UP -->
    <div class="card" id="boxAplikasi" style="display: block;">
      <h2>Sistem PIN Top Up</h2>
      <div class="sub">Validasi Kartu Fleet Direktorat Keuangan</div>
      <div class="input-group">
        <label for="inputKartu">Masukkan 4 Angka Belakang Kartu:</label>
        <input type="text" id="inputKartu" class="input-utama" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="XXXX" autocomplete="off" oninput="sanitasiInputKartu(this)" onkeydown="if(event.key === 'Enter') prosesCari()">
      </div>
      <button type="button" id="btnCari" onclick="prosesCari()">Ambil Data PIN</button>
      <div id="loader" class="loading">Memeriksa database...</div>
      <div id="areaHasil" class="result"></div>
      
      <div id="formLanjutan">
        <div class="input-group">
          <label for="inputPpd">Nomor PPD:</label>
          <input type="text" id="inputPpd" placeholder="Contoh: 0001/0210003/07/26">
        </div>
        <div class="input-group">
          <label for="inputPengirim">Nama Pengirim (Unit/Bagian):</label>
          <input type="text" id="inputPengirim" placeholder="Otomatis Terisi">
        </div>
        <div class="input-group">
          <label for="inputJumlah">Jumlah Top Up Baru (Rp):</label>
          <input type="number" id="inputJumlah" placeholder="Contoh: 500000">
        </div>
        <button type="button" class="btn-simpan" onclick="simpanKeTransaksi()">✓ Simpan Ke Sheet Transaksi</button>
      </div>
      <div id="areaGagal" class="gagal" style="display:none;"></div>
    </div>

  </div>

  <script>
    // PASTE URL EXEC GOOGLE APPS SCRIPT ANDA DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbyN0Q4LnnXNSCpi0ArX3w8fA_ad0Y16RoM2pWxT60N-Pwkrn44J7-yO93ZUouHeufB9Vw/exec";

    // PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js?v=2').catch(err => console.error(err));
      });
    }

    let deferredPrompt;
    const installBtn = document.getElementById('btnInstallPWA');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block';
    });

    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });

    // App Logic
    var dataKartuSistem = {};

    function autoFill4Angka(el) {
      var val = el.value.trim();
      if(val.length >= 4) {
        document.getElementById('new4Angka').value = val.slice(-4);
      }
    }

    function sanitasiInputKartu(el) {
      el.value = el.value.replace(/[^0-9]/g, '');
      document.getElementById('areaHasil').style.display = 'none';
      document.getElementById('formLanjutan').style.display = 'none';
      document.getElementById('areaGagal').style.display = 'none';
    }

    async function prosesLogin() {
      var u = document.getElementById('userLogin').value;
      var p = document.getElementById('passLogin').value;
      if(!p) { alert("Password wajib diisi!"); return; }

      try {
        let res = await fetch(`${API_URL}?action=cekLogin&u=${encodeURIComponent(u)}&p=${encodeURIComponent(p)}`);
        let data = await res.json();
        
        if(data.status === "sukses") {
          document.getElementById('boxLogin').style.display = "none";
          document.getElementById('mainContainer').style.display = "block";
          document.getElementById('inputKartu').focus();
        } else {
          alert(data.pesan);
        }
      } catch (err) {
        alert("Gagal koneksi ke server: " + err.message);
      }
    }

    async function simpanDataPinBaru() {
      var noLengkap = document.getElementById('newNoLengkap').value;
      var empatAngka = document.getElementById('new4Angka').value;
      var pin = document.getElementById('newPin').value;
      var ket = document.getElementById('newKet').value;
      var unit = document.getElementById('newUnit').value;

      if(!noLengkap || !pin || !unit) {
        alert("Nomor Kartu Lengkap, PIN, dan Unit wajib diisi!");
        return;
      }

      var loader = document.getElementById('loader');
      loader.innerText = "Menyimpan Data PIN baru...";
      loader.style.display = "block";

      try {
        let res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "simpanDataPin",
            nomorLengkap: noLengkap,
            empatAngka: empatAngka,
            pin: pin,
            keterangan: ket,
            unit: unit
          })
        });
        let data = await res.json();
        loader.style.display = "none";
        alert(data.pesan);

        if(data.status === "sukses") {
          document.getElementById('newNoLengkap').value = "";
          document.getElementById('new4Angka').value = "";
          document.getElementById('newPin').value = "";
          document.getElementById('newUnit').value = "";
        }
      } catch (err) {
        loader.style.display = "none";
        alert("Gagal menyimpan: " + err.message);
      }
    }

    async function prosesCari() {
      var inputVal = document.getElementById('inputKartu').value;
      var resultDiv = document.getElementById('areaHasil');
      var gagalDiv = document.getElementById('areaGagal');
      var formLanjutan = document.getElementById('formLanjutan');
      var loader = document.getElementById('loader');

      if(inputVal.length !== 4) { alert("Harap masukkan 4 digit angka belakang kartu!"); return; }

      resultDiv.style.display = "none";
      gagalDiv.style.display = "none";
      formLanjutan.style.display = "none";
      
      loader.innerText = "Memeriksa database...";
      loader.style.display = "block";

      try {
        let res = await fetch(`${API_URL}?action=cariDataTopUp&empatAngka=${encodeURIComponent(inputVal)}`);
        let data = await res.json();
        loader.style.display = "none";

        if(data.status === "sukses") {
          dataKartuSistem = data;
          resultDiv.style.display = "block";
          resultDiv.className = "result sukses";
          resultDiv.innerHTML = 
            "<div class='pin-title'>Gunakan PIN ini di Mesin: (By Jeffry@2026)</div>" +
            "<div class='pin-box'>" + data.pin + "</div>" +
            "<div class='detail-row'><span>No Kartu Lengkap:</span><span class='detail-val'>" + data.kartuLengkap + "</span></div>" +
            "<div class='detail-row'><span>4 Digit Terakhir:</span><span class='detail-val'>" + data.empatAngka + "</span></div>" +
            "<div class='detail-row'><span>Status Kartu:</span><span class='badge-aktif'>" + data.statusKartu + "</span></div>";
          document.getElementById('inputPengirim').value = data.unit || "";
          formLanjutan.style.display = "block";
        } else {
          gagalDiv.style.display = "block";
          gagalDiv.innerText = data.pesan;
        }
      } catch (err) {
        loader.style.display = "none";
        alert("Error server: " + err.message);
      }
    }

    async function simpanKeTransaksi() {
      var loader = document.getElementById('loader');
      var ppd = document.getElementById('inputPpd').value;
      var pengirim = document.getElementById('inputPengirim').value;
      var jumlah = document.getElementById('inputJumlah').value;

      if(!ppd || !pengirim || !jumlah) { alert("Harap isi No PPD, Pengirim, dan Jumlah Top Up!"); return; }

      loader.innerText = "Menyimpan data transaksi baru...";
      loader.style.display = "block";

      try {
        let res = await fetch(API_URL, {
          method: "POST",
          body: JSON.stringify({
            action: "simpanTransaksi",
            noPpd: ppd,
            empatAngka: dataKartuSistem.empatAngka,
            pin: dataKartuSistem.pin,
            pengirim: pengirim,
            jumlah: jumlah
          })
        });
        let data = await res.json();
        loader.style.display = "none";
        alert(data.pesan);

        if(data.status === "sukses") {
          document.getElementById('inputKartu').value = "";
          document.getElementById('inputPpd').value = "";
          document.getElementById('inputPengirim').value = "";
          document.getElementById('inputJumlah').value = "";
          document.getElementById('areaHasil').style.display = "none";
          document.getElementById('formLanjutan').style.display = "none";
        }
      } catch (err) {
        loader.style.display = "none";
        alert("Gagal simpan transaksi: " + err.message);
      }
    }
  </script>
</body>
</html>
